<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ログイン</title>
</head>
<body>
    <h1>管理者ログイン画面</h1>

    <!-- エラーメッセージ -->
    <p th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/admin/login}" method="post">
        <h3>パスワード</h3>
        <input type="password" name="password" required>
        <button type="submit">ログイン</button>
    </form>
    </body>
</html>
