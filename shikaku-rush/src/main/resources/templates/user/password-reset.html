<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>パスワード再設定</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
  <link rel="stylesheet" th:href="@{/css/user/password-reset.css}">
</head>
<body>
<div>
  <h1>パスワード再設定</h1>

  <!-- トークンエラー -->
  <div th:if="${tokenError}">
    <p>このリンクは無効または期限切れです。
      <a th:href="@{/user/password-reset-email}">再度メールアドレスを入力してください ▶</a>
    </p>
  </div>

  <!-- パスワード変更フォーム -->
  <div th:if="${!tokenError}">
    <!-- エラーメッセージ -->
    <p th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/user/password-reset}" method="post">
      <!-- トークンを隠しフィールドで保持 -->
      <input type="hidden" name="token" th:value="${token}">

      <label>新しいパスワード</label>
      <input type="password" name="password" required minlength="8">
      <span th:if="${passwordError}" th:text="${passwordError}"></span>

      <label>パスワード再入力</label>
      <input type="password" name="passwordConfirm" required>
      <span th:if="${passwordConfirmError}" th:text="${passwordConfirmError}"></span>

      <button type="submit">パスワードを変更する</button>
    </form>
  </div>
</div>
</body>
</html>
