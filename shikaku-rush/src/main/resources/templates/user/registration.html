<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
  <link rel="stylesheet" th:href="@{/css/user/registration.css}">
</head>
<body>
<div>
  <!-- トークンエラー -->
  <div th:if="${tokenError}">
    <p>このリンクは無効または期限切れです。
      <a th:href="@{/user/registered-email}">メールアドレス入力に戻る ▶</a>
    </p>
  </div>

  <!-- 登録フォーム -->
  <div th:if="${!tokenError}">
    <!-- エラーメッセージ -->
    <p th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/user/registration}" method="post">
      <!-- トークンを隠しフィールドで保持 -->
      <input type="hidden" name="token" th:value="${token}">

      <label>ユーザーネーム</label>
      <input type="text" name="username" maxlength="15"
             th:value="${username}" required>
      <p>(15文字以内・英数字のみ・記号/日本語禁止)</p>
      <span th:if="${usernameError}" th:text="${usernameError}"></span>

      <label>パスワード</label>
      <input type="password" name="password" required>
      <span th:if="${passwordError}" th:text="${passwordError}"></span>

      <label>パスワード再入力</label>
      <input type="password" name="passwordConfirm" required>
      <span th:if="${passwordConfirmError}" th:text="${passwordConfirmError}"></span>

      <button type="submit">登録</button>
    </form>
  </div>
</div>
</body>
</html>
