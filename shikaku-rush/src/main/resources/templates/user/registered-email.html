<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>登録用メールアドレス</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
  <link rel="stylesheet" th:href="@{/css/user/registered-email.css}">
</head>
<body>
<div>
  <h1>新規登録</h1>

  <!-- 送信完了メッセージ -->
  <p th:if="${message}" th:text="${message}"></p>

  <!-- エラーメッセージ -->
  <p th:if="${error}" th:text="${error}"></p>

  <!-- 送信前のみフォームを表示 -->
  <div th:if="${!sent}">
    <form th:action="@{/user/registered-email}" method="post">
      <label>登録用メールアドレス</label>
      <input type="email" name="email" required
             th:value="${email}">
      <span th:if="${emailError}" th:text="${emailError}"></span>
      <button type="submit">メールを送る</button>
    </form>
  </div>

  <a th:href="@{/user/login}">↲</a>
</div>
</body>
</html>
