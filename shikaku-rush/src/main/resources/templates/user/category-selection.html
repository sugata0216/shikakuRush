<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カテゴリ選択</title>
    <link rel="stylesheet" th:href="@{/css/user/category-selection.css}">
</head>

<body>
    <div class="bg-grid"></div>

    <main class="main-container">
        <h1>Category Select</h1>

        <div class="content-wrap">
            <div class="category-list">
                <div class="category-item" th:each="category : ${categories}">
                    <a th:href="@{/user/difficulty(genreId=${genreId}, categoryId=${category.id})}">
                        <span class="text">
                            <p class="title" th:text="${category.name}"></p>
                        </span>
                    </a>
                </div>
            </div>
            <div class="back-btn">
                <a href="/user/genre">戻る↵</a>
            </div>
        </div>
    </main>

    <div th:replace="~{user/layout :: menubar}"></div>
</body>
</html>
