<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>マイページ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
    <link rel="stylesheet" th:href="@{/css/user/my-page.css}">
</head>
<body>
  <h1>My Page</h1>
  <div>
    <div>
      <!-- ✅ タブ切り替えボタンをリンクに変更 -->
      <a th:href="@{/user/my-page(tab=1, genreId=${selectedGenreId}, difficultyId=${selectedDifficultyId})}">
        <button type="button" th:classappend="${activeTab == 1} ? 'active' : ''">マイページ</button>
      </a>
      <a th:href="@{/user/my-page(tab=2, genreId=${selectedGenreId}, difficultyId=${selectedDifficultyId})}">
        <button type="button" th:classappend="${activeTab == 2} ? 'active' : ''">マイスコア</button>
      </a>
    </div>

    <div id="tab1" th:style="${activeTab == 1} ? 'display: block;' : 'display: none;'">

      <!-- ✅ ユーザー名変更 -->
      <h3>ユーザー名</h3>
      <p th:if="${usernameError}" th:text="${usernameError}"></p>
      <p th:if="${usernameSuccess}" th:text="${usernameSuccess}"></p>
      <form th:action="@{/user/my-page/username}" method="post">
        <input type="text"
               name="username"
               maxlength="15"
               placeholder="英数字のみ・15文字以内"
               th:value="${username}"
               th:disabled="${usernameChangedThisMonth}"
               required>
        <button type="submit" th:disabled="${usernameChangedThisMonth}">変更</button>
      </form>
      <p th:if="${usernameChangedThisMonth}">今月はすでにユーザー名を変更済みです</p>

      <!-- ✅ 称号変更 -->
      <h3>称号</h3>
      <p th:if="${titleError}" th:text="${titleError}"></p>
      <p th:if="${titleSuccess}" th:text="${titleSuccess}"></p>
      <form th:action="@{/user/my-page/title}" method="post">
        <select name="titleId">
          <option value="" th:selected="${selectedTitleId == null}">未選択</option>
          <option th:each="title : ${ownedTitles}"
                  th:value="${title.id}"
                  th:text="${title.name}"
                  th:selected="${title.id == selectedTitleId}">
          </option>
        </select>
        <button type="submit">変更</button>
      </form>
      <p th:if="${#lists.isEmpty(ownedTitles)}">所持している称号はありません</p>

      <a th:href="@{/user/inquiry}">お問い合わせ</a>
      <br>

      <!-- ✅ ログアウト -->
      <form th:action="@{/user/logout}" method="post">
        <button type="submit">ログアウト</button>
      </form>

      <!-- ✅ fetchからフォーム送信に変更 -->
      <form th:action="@{/user/my-page/delete}" method="post"
            onsubmit="return confirmDelete()">
        <button type="submit">退会する</button>
      </form>
    </div>

    <div id="tab2" th:style="${activeTab == 2} ? 'display: block;' : 'display: none;'">

      <!-- ✅ フォームにtab=2を追加 -->
      <form th:action="@{/user/my-page}" method="get">
        <input type="hidden" name="tab" value="2">
        <select name="genreId">
          <option value="1" th:selected="${selectedGenreId == 1}">ITパスポート</option>
          <option value="2" th:selected="${selectedGenreId == 2}">基本情報技術者試験</option>
          <option value="3" th:selected="${selectedGenreId == 3}">英語</option>
        </select>
        <select name="difficultyId">
          <option th:each="difficulty : ${difficulties}"
                  th:value="${difficulty.id}"
                  th:text="${difficulty.name}"
                  th:selected="${difficulty.id == selectedDifficultyId}">
          </option>
        </select>
        <button type="submit">表示</button>
      </form>

      <!-- ✅ カルーセル -->
      <div id="carousel">
        <button type="button" onclick="prevCard()">◀</button>
        <button type="button" onclick="nextCard()">▶</button>

        <!-- ✅ カテゴリごとのスコアカード -->
        <div th:each="entry, iterStat : ${scoreMap}"
             th:id="'card-' + ${iterStat.index}"
             th:style="${iterStat.index == 0} ? 'display: block;' : 'display: none;'">

          <div th:text="${entry.key.name}"></div>

          <!-- スコアがある場合 -->
          <div th:if="${not #lists.isEmpty(entry.value)}">
            <div th:each="score, scoreStat : ${entry.value}">
              <div th:text="${scoreStat.index + 1}"></div>
              <div>
                <span th:text="${score.score}"></span>
                <small>pt</small>
              </div>
            </div>
          </div>

          <!-- スコアがない場合 -->
          <div th:if="${#lists.isEmpty(entry.value)}">
            <p>まだスコアがありません</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- ✅ th:replace でフラグメントを埋め込む -->
  <div th:replace="~{user/layout :: menubar}"></div>
  <script>
    // ✅ handleDeleteをconfirmDeleteに変更
    function confirmDelete() {
      if (!confirm('本当に退会しますか？\nスコア履歴・称号などのデータはすべて削除されます。')) return false;
      if (!confirm('退会すると元に戻せません。\n本当によろしいですか？')) return false;
      return true;
    }
    // ── カルーセル ────────────────────────────────────────
    let currentCard = 0;
    const totalCards = [[${scoreMap.size()}]];

    function showCard(index) {
      for (let i = 0; i < totalCards; i++) {
        const card = document.getElementById('card-' + i);
        if (card) card.style.display = 'none';
      }
      const target = document.getElementById('card-' + index);
      if (target) target.style.display = 'block';
    }

    function prevCard() {
      currentCard = (currentCard - 1 + totalCards) % totalCards;
      showCard(currentCard);
    }

    function nextCard() {
      currentCard = (currentCard + 1) % totalCards;
      showCard(currentCard);
    }
  </script>
</body>
</html>
