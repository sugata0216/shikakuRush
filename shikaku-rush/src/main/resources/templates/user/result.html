<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リザルト</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/user/result.css}" />
</head>
<body th:classappend="${gameOver} ? 'is-gameover' : 'is-clear'">

<!-- ✅ ゲームクリア時 -->
<div class="result-page" th:if="${!gameOver}">

    <!-- スプラッシュ演出 -->
    <div class="splash-screen" id="splash" onclick="hideSplash()">
        <h1 class="splash-title splash-line1">Game</h1>
        <h1 class="splash-title splash-line2">Clear!!</h1>
    </div>

    <!-- ✅ カルーセル -->
    <div class="carousel-wrapper">
        <button type="button" class="carousel-arrow arrow-left" onclick="prevCard()">&#9664;</button>
        <button type="button" class="carousel-arrow arrow-right" onclick="nextCard()">&#9654;</button>

        <!-- ✅ カード1：問題一覧 -->
        <div id="card-0" class="card active result-card">
            <h2 class="result-title">Game Clear!!</h2>

            <div class="score-box">
                <p class="score-label">Score</p>
                <p class="score-value">$<span th:text="${#numbers.formatInteger(score, 8)}">00000000</span></p>
            </div>

            <div class="result-list">
                <div class="result-row" th:each="question, iterStat : ${questions}" th:if="${iterStat.index < 10}">
                    <span class="result-mark" th:if="${correctList != null}">
                        <span class="mark-correct" th:if="${correctList[iterStat.index]}">&#9675;</span>
                        <span class="mark-wrong" th:unless="${correctList[iterStat.index]}">&#10005;</span>
                    </span>
                    <span class="result-num" th:text="${iterStat.index + 1}"></span>
                    <span class="result-question" th:text="${question.questionText}"></span>
                    <button type="button"
                            class="detail-btn"
                            th:data-id="${question.id}"
                            th:data-question="${question.questionText}"
                            th:data-answer="${question.correctAnswer}"
                            th:data-choice1="${question.choice1}"
                            th:data-choice2="${question.choice2}"
                            th:data-choice3="${question.choice3}"
                            th:data-choice4="${question.choice4}"
                            th:data-explanation="${question.explanation}"
                            th:data-source="${question.sourceName}"
                            th:data-category="${question.categoryName}">
                        詳細
                    </button>
                </div>
            </div>

            <div class="result-actions">
                <a class="btn-outline" th:href="@{/user/genre}">ジャンル選択に戻る</a>
                <a class="btn-primary" th:href="@{/user/loading(genreId=${genreId}, categoryId=${categoryId}, difficultyId=${difficultyId})}">リトライ</a>
            </div>
        </div>

        <!-- ✅ カード2：ランキング（ALLカテゴリ時のみ表示） -->
        <div id="card-1" class="card result-card" th:if="${rankings != null}">
            <h2 class="result-title">Game Clear!!</h2>
            <h3 class="result-subtitle">RANKING</h3>

            <div class="result-list ranking-list">
                <p class="ranking-empty" th:if="${#lists.isEmpty(rankings)}">まだランキングデータがありません</p>
                <div class="ranking-row" th:each="ranking, iterStat : ${rankings}" th:classappend="${iterStat.index == 0} ? 'ranking-first'">
                    <span class="ranking-num" th:text="${iterStat.index + 1}"></span>
                    <span class="ranking-name" th:text="${ranking.username}"></span>
                    <span class="ranking-score"><span th:text="${ranking.score}"></span>pt</span>
                </div>
            </div>

            <div class="result-actions">
                <a class="btn-outline" th:href="@{/user/genre}">ジャンル選択に戻る</a>
                <a class="btn-primary" th:href="@{/user/loading(genreId=${genreId}, categoryId=${categoryId}, difficultyId=${difficultyId})}">リトライ</a>
            </div>
        </div>
    </div>
</div>

<!-- ✅ ゲームオーバー時 -->
<div class="result-page" th:if="${gameOver}">

    <!-- スプラッシュ演出 -->
    <div class="splash-screen" id="splash" onclick="hideSplash()">
        <h1 class="splash-title splash-line1">Game</h1>
        <h1 class="splash-title splash-line2">Over...</h1>
    </div>

    <div class="carousel-wrapper">
        <div id="card-0" class="card active result-card">
            <h2 class="result-title">Game Over...</h2>

            <div class="score-box">
                <p class="score-label">Score</p>
                <p class="score-value">$<span th:text="${#numbers.formatInteger(score, 8)}">00000000</span></p>
            </div>

            <div class="result-list">
                <div class="result-row" th:each="question, iterStat : ${questions}" th:if="${iterStat.index < answeredCount}">
                    <span class="result-mark" th:if="${correctList != null and iterStat.index < #lists.size(correctList)}">
                        <span class="mark-correct" th:if="${correctList[iterStat.index]}">&#9675;</span>
                        <span class="mark-wrong" th:unless="${correctList[iterStat.index]}">&#10005;</span>
                    </span>
                    <span class="result-num" th:text="${iterStat.index + 1}"></span>
                    <span class="result-question" th:text="${question.questionText}"></span>
                    <button type="button"
                            class="detail-btn"
                            th:data-id="${question.id}"
                            th:data-question="${question.questionText}"
                            th:data-answer="${question.correctAnswer}"
                            th:data-choice1="${question.choice1}"
                            th:data-choice2="${question.choice2}"
                            th:data-choice3="${question.choice3}"
                            th:data-choice4="${question.choice4}"
                            th:data-explanation="${question.explanation}"
                            th:data-source="${question.sourceName}"
                            th:data-category="${question.categoryName}">
                        詳細
                    </button>
                </div>
            </div>

            <div class="result-actions">
                <a class="btn-outline" th:href="@{/user/genre}">ジャンル選択に戻る</a>
                <a class="btn-primary" th:href="@{/user/loading(genreId=${genreId}, categoryId=${categoryId}, difficultyId=${difficultyId})}">リトライ</a>
            </div>
        </div>
    </div>
</div>

<!-- ✅ 詳細ポップアップ -->
<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup" style="display: none;">
    <div class="popup-header">
        <span id="popupCategory"></span>
        <button type="button" class="popup-close" onclick="closePopup()">✕</button>
    </div>
    <p id="popupQuestion"></p>
    <p><strong>正解：</strong><span id="popupAnswer"></span></p>
    <p><strong>解説：</strong><span id="popupExplanation"></span></p>
    <div class="popup-footer">
        <button type="button" class="report-btn" id="reportBtn">問題を報告する</button>
        <span id="popupSource"></span>
    </div>
</div>

<div th:replace="~{user/layout :: menubar}"></div>

<script>
    // ── スプラッシュ演出 ──────────────────────────────────
    const splash = document.getElementById('splash');

    function hideSplash() {
        if (!splash) return;
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 500);
    }

    // 2秒間 Game Clear!! / Game Over... を表示してから結果画面へ切り替え
    setTimeout(hideSplash, 2000);

    // ── カルーセル ────────────────────────────────────────
    let currentCard = 0;
    const cards = document.querySelectorAll('.card');
    const totalCards = cards.length;

    function showCard(index) {
        cards.forEach(card => card.classList.remove('active'));
        if (cards[index]) cards[index].classList.add('active');
    }

    function prevCard() {
        currentCard = (currentCard - 1 + totalCards) % totalCards;
        showCard(currentCard);
    }

    function nextCard() {
        currentCard = (currentCard + 1) % totalCards;
        showCard(currentCard);
    }

    // ── 詳細ポップアップ ──────────────────────────────────
    document.querySelectorAll('.detail-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {

            // 正解番号から正解テキストに変換
            const choices = [
                btn.dataset.choice1,
                btn.dataset.choice2,
                btn.dataset.choice3,
                btn.dataset.choice4
            ];
            const correctIndex = parseInt(btn.dataset.answer) - 1;
            const correctText = choices[correctIndex] || btn.dataset.answer;

            document.getElementById('popupCategory').textContent    = this.dataset.category || '';
            document.getElementById('popupQuestion').textContent    = this.dataset.question;
            document.getElementById('popupAnswer').textContent      = correctText; // テキストに変更
            document.getElementById('popupExplanation').textContent = this.dataset.explanation || '解説なし';
            document.getElementById('popupSource').textContent      = this.dataset.source || '';

            document.getElementById('reportBtn').onclick = function() {
                const id = btn.dataset.id;
                const question = btn.dataset.question;
                const choice1 = btn.dataset.choice1;
                const choice2 = btn.dataset.choice2;
                const choice3 = btn.dataset.choice3;
                const choice4 = btn.dataset.choice4;
                const answer = btn.dataset.answer;

                const url = '/user/report'
                    + '?questionId=' + id
                    + '&questionText=' + encodeURIComponent(question)
                    + '&choice1=' + encodeURIComponent(choice1)
                    + '&choice2=' + encodeURIComponent(choice2)
                    + '&choice3=' + encodeURIComponent(choice3)
                    + '&choice4=' + encodeURIComponent(choice4)
                    + '&correctAnswer=' + encodeURIComponent(answer);
                window.open(url, '_blank');
            };

            document.getElementById('overlay').classList.add('active');
            document.getElementById('popup').style.display = 'block';
        });
    });

    function closePopup() {
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('popup').style.display = 'none';
    }
</script>
</body>
</html>
