<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワードリセット</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
    <link rel="stylesheet" th:href="@{/css/user/password-reset-email.css}">
</head>
<body>
<div>
    <h1>パスワードリセット</h1>
    <p>登録済みのメールアドレスを入力してください。</p>

    <!-- 送信完了メッセージ -->
    <p th:if="${message}" th:text="${message}"></p>

    <!-- エラーメッセージ -->
    <p th:if="${error}" th:text="${error}"></p>

    <!-- 送信前のみフォームを表示 -->
    <div th:if="${!sent}">
        <form th:action="@{/user/password-reset-email}" method="post">
            <label>メールアドレス</label>
            <input type="email" name="email" required
                   th:value="${email}">
            <span th:if="${emailError}" th:text="${emailError}"></span>
            <button type="submit">メールを送る</button>
        </form>
    </div>

    <a th:href="@{/user/login}">↲ ログイン画面に戻る</a>
</div>
</body>
</html>
