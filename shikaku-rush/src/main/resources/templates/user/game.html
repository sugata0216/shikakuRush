<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ゲーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/user/game.css}" />
</head>
<body>

<!-- 演出用の全画面オーバーレイ -->
<div id="screenOverlay" class="screen-overlay"></div>

<div class="game-container">
    <!-- ヘッダーセクション -->
    <div class="header">
        <div class="header-item">
            <h4>Category</h4>
            <h4 th:text="${categoryName}">ストラテジ</h4>
        </div>
        <div class="header-item">
            <h4>TIME</h4>
            <h3 id="timer" th:text="${timeLimit}">00 : 14</h3>
        </div>
        <div class="header-item">
            <h4>question</h4>
            <h4 th:text="${currentIndex + 1} + '/' + ${totalQuestions}">2/10</h4>
        </div>
    </div>

    <div class="enemy-container">
        <img th:src="@{/img/enemy.png}" src="../../static/img/enemy.png" alt="敵キャラクター" class="enemy-image anim-spawn" id="enemyImage">
    </div>

    <!-- 問題テキストセクション -->
    <div class="question-container">
        <div class="question-label">question</div>
        <p class="question-text" th:text="${question.questionText}">情報戦略の投資効果を評価するとき、利益額を分子に、投資額を分母にして算出するものはどれか。</p>
    </div>

    <!-- 選択肢セクション -->
    <form th:action="@{/user/game/answer}" method="post" class="answer-form">
        <input type="hidden" name="answer" id="answerInput" value="">
        <input type="hidden" name="timeLeft" id="timeLeftInput" value="60">
        
        <!-- 難易度ID・正解情報・制限時間・現在問題番号をJSに引き渡す hidden 要素 -->
        <input type="hidden" id="difficultyIdInput" th:value="${session.difficultyId}">
        <input type="hidden" id="correctAnswerInput" th:value="${question.correctAnswer}">
        <input type="hidden" id="timeLimitInput" th:value="${session.timeLimit}">
        <input type="hidden" id="currentIndexInput" th:value="${currentIndex}">
        
        <div class="choices-grid">
            <div class="answer-choice choice-a" onclick="submitAnswer('1')" style="cursor: pointer;">
                <div class="choice-label">A</div>
                <p class="choice-text" th:text="${question.choice1}">EVA</p>
            </div>
            <div class="answer-choice choice-b" onclick="submitAnswer('2')" style="cursor: pointer;">
                <div class="choice-label">B</div>
                <p class="choice-text" th:text="${question.choice2}">IRR</p>
            </div>
            <div class="answer-choice choice-c" onclick="submitAnswer('3')" style="cursor: pointer;">
                <div class="choice-label">C</div>
                <p class="choice-text" th:text="${question.choice3}">NPV</p>
            </div>
            <div class="answer-choice choice-d" onclick="submitAnswer('4')" style="cursor: pointer;">
                <div class="choice-label">D</div>
                <p class="choice-text" th:text="${question.choice4}">ROI</p>
            </div>
        </div>
        <input type="hidden" name="timedOut" id="timedOutInput" value="false">
    </form>

    <!-- アクションボタンセクション -->
    <div class="action-buttons">
        <button type="button"
                class="change-button"
                th:disabled="${changeUsed}"
                onclick="window.location.href='/user/game/change'">
            <img th:src="@{/img/change-button.png}" src="ここにChange画像のパス" alt="" class="button-icon">
            <span>change</span>
        </button>

        <form th:action="@{/user/game/giveup}" method="post" class="giveup-form" id="giveupForm">
            <button type="button" class="giveup-button" onclick="openModal('giveupModal')">
                <img th:src="@{/img/giveup-button.png}" src="ここにGiveUp画像のパス" alt="" class="button-icon">
                <span>give up</span>
            </button>
        </form>
    </div>
</div>

<!-- Give Up確認モーダル -->
<div id="giveupModal" style="display: none;">
    <div>
        <button onclick="closeModal('giveupModal')">✕</button>
        <h3>ゲームを中断しますか？</h3>
        <p>中断すると、今回のスコアは記録されません。</p>
        <div class="modal-buttons">
            <button type="button" class="modal-cancel" onclick="closeModal('giveupModal')">キャンセル</button>
            <button type="button" class="modal-confirm" onclick="document.getElementById('giveupForm').submit();">確認</button>
        </div>
    </div>
</div>

<!-- Thymeleafのパス解決を行うため th:inline="javascript" を付与 -->
<script th:inline="javascript">
    // ==========================================
    // 1. 敵画像の切り替え処理
    // ==========================================
    // 用意した画像ファイルのパスリスト（ファイル名に合わせて自由に増減してください）
    const enemyImages = [
        /*[[@{/img/enemy.png}]]*/ '../../static/img/enemy.png',
        /*[[@{/img/enemy2.png}]]*/ '../../static/img/enemy2.png',
        /*[[@{/img/enemy3.png}]]*/ '../../static/img/enemy3.png',
        /*[[@{/img/enemy4.png}]]*/ '../../static/img/enemy4.png'
    ];

    const enemyEl = document.getElementById('enemyImage');
    
    // 【完全ランダムにする場合】
    const randomIndex = Math.floor(Math.random() * enemyImages.length);
    
    // 【問題番号に連動させる場合（コメントアウトを切り替えて選べます）】
    // const currentIndex = parseInt(document.getElementById('currentIndexInput').value || '0', 10);
    // const randomIndex = currentIndex % enemyImages.length;

    // 画面ロード時に敵画像をセット
    if (enemyEl && enemyImages.length > 0) {
        enemyEl.src = enemyImages[randomIndex];
    }


    // ==========================================
    // 2. タイマー・ゲームロジック
    // ==========================================
    const initialTimeLimit = parseInt(document.getElementById('timeLimitInput').value || '30', 10);
    let timeLeft = initialTimeLimit; 
    let isSubmitting = false; // 連打防止フラグ

    const timerEl = document.getElementById('timer');
    const timeLeftInput = document.getElementById('timeLeftInput');
    const timedOutInput = document.getElementById('timedOutInput');
    const answerInput = document.getElementById('answerInput');
    const formEl = document.querySelector('.answer-form');
    const overlayEl = document.getElementById('screenOverlay');

    // 難易度と正解の取得 (ハードは difficultyId == 2)
    const difficultyId = parseInt(document.getElementById('difficultyIdInput').value || '1', 10);
    const correctAnswer = document.getElementById('correctAnswerInput').value;

    // 初期表示のタイマーフォーマット
    timerEl.textContent = formatTime(timeLeft);

    const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = formatTime(timeLeft);
        timeLeftInput.value = timeLeft;

        // 【共通】残り時間5秒前でタイマーと画面が赤く点滅
        if (timeLeft <= 5 && !timerEl.classList.contains('timer-warning')) {
            timerEl.classList.add('timer-warning');
            overlayEl.classList.add('screen-warning');
        }

        if (timeLeft <= 0) {
            clearInterval(timer);
            timedOutInput.value = 'true';
            answerInput.value = '';
            handleTimeOut();
        }
    }, 1000);

    // 時間切れ時のアニメーション処理
    function handleTimeOut() {
        if (isSubmitting) return;
        isSubmitting = true;

        // 出現アニメーションと危険警告を解除してアニメーションの衝突を防ぐ
        enemyEl.classList.remove('anim-spawn');
        overlayEl.classList.remove('screen-warning');

        if (difficultyId === 2) {
            // 【ハード・時間切れ】敵攻撃 → 画面が暗くなり送信
            enemyEl.classList.add('anim-attack');
            setTimeout(() => {
                overlayEl.classList.add('active-dark');
            }, 300);
            setTimeout(() => {
                formEl.submit();
            }, 1000);
        } else {
            // 【ノーマル・時間切れ】敵攻撃 → 画面赤くフラッシュ → 敵やられて消えて送信
            enemyEl.classList.add('anim-attack');
            setTimeout(() => {
                overlayEl.classList.add('active-red');
            }, 200);
            setTimeout(() => {
                overlayEl.classList.remove('active-red');
                enemyEl.classList.remove('anim-attack');
                enemyEl.classList.add('anim-defeated');
            }, 600);
            setTimeout(() => {
                formEl.submit();
            }, 1200);
        }
    }

    // 解答ボタン押下時のアニメーション処理
    function submitAnswer(answer) {
        if (isSubmitting) return;
        isSubmitting = true;

        clearInterval(timer);
        answerInput.value = answer;

        // 出現アニメーションと危険警告を解除してアニメーションの衝突を防ぐ
        enemyEl.classList.remove('anim-spawn');
        overlayEl.classList.remove('screen-warning');

        const isCorrect = (String(answer) === String(correctAnswer));

        if (difficultyId === 2 && !isCorrect) {
            // 【ハード・不正解】敵攻撃 → 画面が暗くなり送信
            enemyEl.classList.add('anim-attack');
            setTimeout(() => {
                overlayEl.classList.add('active-dark');
            }, 300);
            setTimeout(() => {
                formEl.submit();
            }, 1000);
        } else {
            // 【ノーマル（正解・不正解）】および【ハード（正解）】
            // 敵がやられて消えて送信
            enemyEl.classList.add('anim-defeated');
            setTimeout(() => {
                formEl.submit();
            }, 700);
        }
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        return `${mins} : ${secs}`;
    }

    /* モーダル開閉 */
    function openModal(id) {
        document.getElementById(id).style.display = 'block';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    document.querySelectorAll('[id$="Modal"]').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === this) closeModal(this.id);
        });
    });
</script>
</body>
</html>
